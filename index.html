<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASE GPT</title>
<style>
body{margin:0;background:#021a12;color:#fff;font-family:sans-serif}
.h{background:radial-gradient(#0a5a3f,#021a12);text-align:center;padding:30px 15px}
.h h1{font-size:42px;margin:0;text-shadow:0 0 15px #00ff88}
select,input{width:92%;max-width:480px;display:block;margin:12px auto;padding:15px 18px;border-radius:30px;border:1.5px solid #1a8a64;background:#082219;color:#a7f3d0;font-size:15px}
.btn{display:block;margin:12px auto;background:#00c27a;color:#fff;border:none;padding:15px 35px;border-radius:30px;font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px}
.ch{border:1px solid #1a6b52;padding:7px 14px;border-radius:20px;font-size:13px;color:#7fe8c0}
#answer{display:none;background:#0a3326;border:1px solid #1a6b52;border-radius:18px;padding:18px;margin:16px;max-width:600px;margin-left:auto;margin-right:auto;text-align:left;line-height:1.6}
.card2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;max-width:500px;margin:auto}
.k{background:#0a3326;border:1px solid #145a43;border-radius:16px;padding:18px;text-align:center}
</style>
</head>
<body>
<div class="h">
<h1>CASE GPT</h1>
<p>Qanoon • Shariat • Fiqah • Sunnat</p>
<select id="country"><option><select id="country">
<option>Pakistan</option>
<option>Saudi Arabia</option>
<option>India</option>
<option>United Arab Emirates</option>
<option>United Kingdom</option>
<option>United States</option>
<option>Turkey</option>
<option>Malaysia</option>
<option>Indonesia</option>
<option>Qatar</option>
<option>Kuwait</option>
<option>Bahrain</option>
<option>Oman</option>
<option>Bangladesh</option>
<option>Canada</option>
<option>Australia</option>
<option>All Other Countries</option>
</select>
<input id="q" placeholder="Yahan Sawal Likhein...">
<button class="btn" onclick="searchGPT()">Search Case GPT</button>
</div>

<div id="answer"></div>

<div class="chips"><div class="ch">Home</div><div class="ch">AI Assistant</div><div class="ch">Shariah & Sunnah</div><div class="ch">Law vs Shariah</div><div class="ch">Qanoon Library</div></div>

<div class="card2">
<div class="k">🤖<br>Ask AI</div><div class="k">📖<br>Shariah & Sunnah</div>
<div class="k">⚖️<br>Law vs Shariah</div><div class="k">📜<br>Qanoon Library</div>
</div>

<script>
function searchGPT(){
let q = document.getElementById('q').value.toLowerCase();
let ansDiv = document.getElementById('answer');
ansDiv.style.display='block';
ansDiv.innerHTML = '⏳ Jawab talaash kiya ja raha hai...';

setTimeout(()=>{
let text = '';
if(q.includes('sister') || q.includes('behen') || q.includes('hisaa')){
text = `<h3>🧕 Sister ka Hissa - Father Property me</h3>
<b>1. Shariat ke mutabiq:</b><br>
- Agar sirf 1 behen hai aur bhai nahi hai to usko 1/2 (aadha) hissa milega.<br>
- Agar 2 ya zyada behene hain aur bhai nahi hai to 2/3 hissa milega.<br>
- Agar bhai ke saath hai to <b>Bhai ko double, Behen ko single</b> (2:1 ka ratio) - Quran Surah Nisa Ayat 11.<br><br>
<b>2. Pakistan Qanoon ke mutabiq:</b><br>
- Muslim Family Laws me Shariat hi follow hoti hai. 1961 ke Qanoon ke mutabiq behen ko uska sharaee hissa milna laazmi hai.<br>
- Father ki zindagi me agar gift nahi kiya to death ke baad wirasat khulegi.<br><br>
<b>3. Aapke case me:</b><br>
Aapne pucha "father property me sister ka hissa". Agar father wafat pa gaye hain aur 1 beta aur 1 beti hai to property ke 3 hisse honge, 2 hisse bhai ko, 1 hissa behen ko.<br><br>
<i>Note: Ye aam malumat hai, apne case ke liye wakeel se raabta karein.</i>`;
} else {
text = `<b>Aapka Sawal:</b> ${q}<br><br>Is sawal ka jawab hamare Qanoon Library me talaash kiya ja raha hai. Filhal hum inheritance, nikah, talaq, property ke sawalon ka jawab de rahe hain. Aap apna sawal detail se likhein.`;
}
ansDiv.innerHTML = text;
}, 1000);
}
</script>
</body>
</html>
